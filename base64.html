<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base64 编码解码 - 万能工具箱</title>
<meta name="description" content="文本与 Base64 相互转换，完美支持中文和 Emoji，纯本地处理。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / Base64 编码解码</div>
  <div class="panel">
    <h2>🔤 Base64 编码解码</h2>
    <p class="desc">支持中文、Emoji 及任意文本的 Base64 编码与解码，全部在本地浏览器完成。</p>
    <div class="toggle"><button class="active" data-m="encode">编码</button><button data-m="decode">解码</button></div>
    <label>输入</label>
    <textarea id="input" placeholder="输入要转换的内容"></textarea>
    <div class="actions"><button class="btn" id="run">转换</button><button class="btn ghost" id="copy">复制结果</button><button class="btn ghost" id="clear">清空</button></div>
    <label>输出</label>
    <div class="result" id="output">结果将显示在这里…</div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script>
let mode='encode';
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.toggle button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');mode=b.dataset.m;run();
});
function conv(s){
  if(mode==='encode')return btoa(unescape(encodeURIComponent(s)));
  try{return decodeURIComponent(escape(atob(s.trim())))}catch(e){return '❌ 解码失败，请确认输入是合法的 Base64'}
}
function run(){const v=document.getElementById('input').value;document.getElementById('output').textContent=v?conv(v):'结果将显示在这里…'}
document.getElementById('run').onclick=run;
document.getElementById('input').oninput=run;
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('output').textContent);alert('已复制')};
document.getElementById('clear').onclick=()=>{document.getElementById('input').value='';run()};
</script></body></html>
