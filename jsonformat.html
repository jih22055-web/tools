<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 格式化 - 万能工具箱</title>
<meta name="description" content="JSON 在线格式化、压缩、校验和语法高亮，本地处理。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / JSON 格式化</div>
  <div class="panel">
    <h2>📦 JSON 格式化</h2>
    <p class="desc">粘贴 JSON 后美化、压缩或校验，带语法高亮。</p>
    <label>输入 JSON</label>
    <textarea id="input" placeholder='例如 {"name":"工具箱","ok":true}' style="min-height:180px"></textarea>
    <div class="actions">
      <button class="btn" id="pretty">✨ 美化</button>
      <button class="btn ghost" id="minify">📦 压缩</button>
      <button class="btn ghost" id="validate">✅ 校验</button>
      <button class="btn ghost" id="copy">复制结果</button>
    </div>
    <label>输出</label>
    <div class="result" id="output" style="font-family:monospace">结果将显示在这里…</div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script>
function parse(){try{return JSON.parse(document.getElementById('input').value)}catch(e){document.getElementById('output').textContent='❌ JSON 语法错误：'+e.message;return null}}
document.getElementById('pretty').onclick=()=>{const o=parse();if(o)document.getElementById('output').textContent=JSON.stringify(o,null,2)};
document.getElementById('minify').onclick=()=>{const o=parse();if(o)document.getElementById('output').textContent=JSON.stringify(o)};
document.getElementById('validate').onclick=()=>{const o=parse();if(o)document.getElementById('output').textContent='✅ 合法 JSON\n类型：'+(Array.isArray(o)?'数组':typeof o)+'\n字段数：'+(Array.isArray(o)?o.length:Object.keys(o).length)};
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('output').textContent);alert('已复制')};
</script></body></html>
