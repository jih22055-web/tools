<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>二维码生成器 - 万能工具箱</title>
<meta name="description" content="输入文字或链接，一键生成二维码并下载，纯本地生成。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / 二维码生成器</div>
  <div class="panel">
    <h2>🔳 二维码生成器</h2>
    <p class="desc">输入网址或文字，实时生成二维码，可自定义大小并下载图片。</p>
    <label>内容</label>
    <textarea id="text" placeholder="输入网址或文字，例如 https://example.com" style="min-height:90px">https://example.com</textarea>
    <div class="row" style="margin-top:16px">
      <div><label>尺寸（像素）</label><input type="number" id="size" value="300" min="100" max="1000"></div>
      <div><label>前景色</label><input type="text" id="fg" value="#000000"></div>
      <div><label>背景色</label><input type="text" id="bg" value="#ffffff"></div>
    </div>
    <div class="actions"><button class="btn" id="gen">生成二维码</button><button class="btn ghost" id="download" style="display:none">⬇️ 下载 PNG</button></div>
    <div class="preview" id="preview" style="display:none"><canvas id="canvas"></canvas></div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script src="qrcode.min.js"></script>
<script>
let qr=null;
function gen(){
  const text=document.getElementById('text').value.trim();
  if(!text)return alert('请输入内容');
  const size=+document.getElementById('size').value||300;
  const fg=document.getElementById('fg').value||'#000000';
  const bg=document.getElementById('bg').value||'#ffffff';
  const box=document.getElementById('canvas');
  box.innerHTML='';
  if(typeof QRCode==='undefined'){alert('二维码组件加载失败，请检查网络后刷新');return}
  qr=new QRCode(box,{text,width:size,height:size,colorDark:fg,colorLight:bg,correctLevel:QRCode.CorrectLevel.M});
  document.getElementById('preview').style.display='block';
  document.getElementById('download').style.display='inline-flex';
}
document.getElementById('gen').onclick=gen;
document.getElementById('download').onclick=()=>{
  const c=document.querySelector('#canvas canvas');if(!c)return;
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='qrcode.png';a.click();
};
gen();
</script></body></html>
