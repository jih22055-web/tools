<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>密码生成器 - 万能工具箱</title>
<meta name="description" content="生成高强度随机密码，可自定义长度、数字、大小写字母和符号，本地生成安全。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / 密码生成器</div>
  <div class="panel">
    <h2>🔐 密码生成器</h2>
    <p class="desc">使用浏览器加密随机数生成高强度密码，本地生成，不联网、不记录。</p>
    <div class="result" id="password" style="font-size:26px;text-align:center;letter-spacing:2px;min-height:70px;display:grid;place-items:center;color:var(--brand);font-weight:700">点击生成</div>
    <div class="actions" style="justify-content:center"><button class="btn ghost" id="copy">📋 复制</button><button class="btn" id="gen">🔄 生成密码</button></div>
    <label>密码长度：<span id="lenVal">16</span></label>
    <input type="range" id="len" min="4" max="64" value="16" style="width:100%;padding:0;accent-color:var(--brand)">
    <div class="row" style="margin-top:18px">
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="lower" checked style="width:auto"> 小写字母</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="upper" checked style="width:auto"> 大写字母</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="digit" checked style="width:auto"> 数字</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="sym" checked style="width:auto"> 符号</label>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="num" id="strength">-</div><div class="lbl">强度</div></div>
      <div class="stat"><div class="num" id="entropy">-</div><div class="lbl">熵值（位）</div></div>
    </div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script>
function rand(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function gen(){
  let pool='';
  if(document.getElementById('lower').checked)pool+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('upper').checked)pool+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('digit').checked)pool+='0123456789';
  if(document.getElementById('sym').checked)pool+='!@#$%^&*()-_=+[]{}?';
  if(!pool)return alert('至少选择一种字符类型');
  const len=+document.getElementById('len').value;
  let pw='';for(let i=0;i<len;i++)pw+=pool[rand(pool.length)];
  document.getElementById('password').textContent=pw;
  const entropy=Math.round(len*Math.log2(pool.length));
  document.getElementById('entropy').textContent=entropy;
  let s,lvl,c;
  if(entropy<40){s='弱';c='var(--danger)';lvl='🔴'}else if(entropy<60){s='中';c='var(--brand)';lvl='🟡'}else if(entropy<80){s='强';c='var(--ok)';lvl='🟢'}else{s='极强';c='var(--ok)';lvl='🟢'}
  const el=document.getElementById('strength');el.textContent=lvl+' '+s;el.style.color=c;
}
document.getElementById('len').oninput=e=>{document.getElementById('lenVal').textContent=e.target.value;gen()};
['lower','upper','digit','sym'].forEach(id=>document.getElementById(id).onchange=gen);
document.getElementById('gen').onclick=gen;
document.getElementById('copy').onclick=()=>{const p=document.getElementById('password').textContent;if(p!=='点击生成'){navigator.clipboard.writeText(p);alert('已复制')}};
gen();
</script></body></html>
