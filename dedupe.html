<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文本去重 - 万能工具箱</title>
<meta name="description" content="去除文本中的重复行，保留原有顺序，可选择忽略大小写和空行。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / 文本去重</div>
  <div class="panel">
    <h2>📋 文本去重</h2>
    <p class="desc">删除重复的行，保留第一次出现的顺序。适合清理名单、链接、数据列表。</p>
    <label>输入文本（每行一条）</label>
    <textarea id="input" placeholder="apple&#10;banana&#10;apple&#10;orange" style="min-height:200px"></textarea>
    <div class="row" style="margin-top:16px">
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="ignoreCase" style="width:auto"> 忽略大小写</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="trimSpace" checked style="width:auto"> 忽略首尾空格</label>
      <label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" id="noEmpty" checked style="width:auto"> 删除空行</label>
    </div>
    <div class="actions"><button class="btn" id="run">去除重复</button><button class="btn ghost" id="copy">复制结果</button></div>
    <div class="stat-grid">
      <div class="stat"><div class="num" id="before">0</div><div class="lbl">原始行数</div></div>
      <div class="stat"><div class="num" id="after">0</div><div class="lbl">去重后行数</div></div>
      <div class="stat"><div class="num" id="removed">0</div><div class="lbl">删除重复</div></div>
    </div>
    <label>输出</label>
    <div class="result" id="output">结果将显示在这里…</div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script>
function run(){
  let lines=document.getElementById('input').value.split('\n');
  const before=lines.length;
  const ic=document.getElementById('ignoreCase').checked,ts=document.getElementById('trimSpace').checked,ne=document.getElementById('noEmpty').checked;
  const seen=new Set(),out=[];
  for(let l of lines){
    if(ts)l=l.trim();
    if(ne&&l==='')continue;
    const key=ic?l.toLowerCase():l;
    if(!seen.has(key)){seen.add(key);out.push(l)}
  }
  document.getElementById('output').textContent=out.join('\n')||'结果将显示在这里…';
  document.getElementById('before').textContent=before;
  document.getElementById('after').textContent=out.length;
  document.getElementById('removed').textContent=before-out.length;
}
document.getElementById('run').onclick=run;
['ignoreCase','trimSpace','noEmpty'].forEach(id=>document.getElementById(id).onchange=run);
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('output').textContent);alert('已复制')};
</script></body></html>
