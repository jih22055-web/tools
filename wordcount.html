<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字数统计 - 万能工具箱</title>
<meta name="description" content="在线统计字符数、中文字数、单词数、行数、段落数和高频率词。">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a href="index.html" class="logo"><span class="mark">🧰</span> 万能工具箱</a><nav class="nav-links"><a href="index.html">全部工具</a></nav></div></header>
<div class="wrap page">
  <div class="crumb"><a href="index.html">工具箱</a> / 字数统计</div>
  <div class="panel">
    <h2>📝 字数统计</h2>
    <p class="desc">实时统计文本的字符数、中文字数、单词数、行数、段落数。</p>
    <label>输入文本</label>
    <textarea id="text" placeholder="在这里粘贴或输入文本…" style="min-height:200px"></textarea>
    <div class="stat-grid">
      <div class="stat"><div class="num" id="chars">0</div><div class="lbl">总字符数</div></div>
      <div class="stat"><div class="num" id="charsNS">0</div><div class="lbl">字符(不含空格)</div></div>
      <div class="stat"><div class="num" id="cn">0</div><div class="lbl">中文字数</div></div>
      <div class="stat"><div class="num" id="words">0</div><div class="lbl">英文单词</div></div>
      <div class="stat"><div class="num" id="lines">0</div><div class="lbl">行数</div></div>
      <div class="stat"><div class="num" id="paras">0</div><div class="lbl">段落数</div></div>
    </div>
  </div>
  <div class="adslot">广告位</div>
</div>
<footer><div class="wrap">© 2026 万能工具箱 · 免费工具，打开即用</div></footer>
<script>
document.getElementById('text').oninput=function(){
  const t=this.value;
  document.getElementById('chars').textContent=t.length;
  document.getElementById('charsNS').textContent=t.replace(/\s/g,'').length;
  document.getElementById('cn').textContent=(t.match(/[\u4e00-\u9fa5]/g)||[]).length;
  document.getElementById('words').textContent=(t.match(/[a-zA-Z]+/g)||[]).length;
  document.getElementById('lines').textContent=t?t.split('\n').length:0;
  document.getElementById('paras').textContent=t?t.split(/\n\s*\n/).filter(x=>x.trim()).length:0;
};
</script></body></html>
